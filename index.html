<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>reiz.online</title>
  <meta name="description" content="Persoonlijk reisfotoboek — verhalen en foto's van onderweg.">
  <style>
    :root {
      --bg: #FDFBF7;
      --bg-card: #FFFFFF;
      --text: #2C2C2C;
      --text-muted: #6B6B6B;
      --accent: #B8860B;
      --accent-light: #D4A843;
      --border: #E8E2D6;
      --shadow: rgba(0, 0, 0, 0.06);
      --font-serif: 'Georgia', 'Times New Roman', serif;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1A1A17;
        --bg-card: #242420;
        --text: #E8E2D6;
        --text-muted: #9A9A8A;
        --accent: #D4A843;
        --accent-light: #E8C06A;
        --border: #3A3A32;
        --shadow: rgba(0, 0, 0, 0.3);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      line-height: 1.6;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 4rem 1rem 2rem;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    header p {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-style: italic;
      letter-spacing: 0.02em;
    }

    .trips {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    .trips-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr));
      gap: 2rem;
    }

    .trip-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: box-shadow 0.2s ease, transform 0.15s ease;
      display: block;
    }

    .trip-card:hover {
      box-shadow: 0 4px 20px var(--shadow);
      transform: translateY(-2px);
    }

    .trip-card-image {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
      background: var(--border);
    }

    .trip-card-image-placeholder {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: linear-gradient(135deg, var(--border) 0%, var(--bg) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 2rem;
      font-family: var(--font-serif);
    }

    .trip-card-body {
      padding: 1.5rem;
    }

    .trip-card-body h2 {
      font-family: var(--font-serif);
      font-size: 1.4rem;
      font-weight: 400;
      margin-bottom: 0.4rem;
    }

    .trip-card-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
    }

    .trip-card-body p {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
      font-style: italic;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>reiz</h1>
    <p>verhalen en foto's van onderweg</p>
  </header>

  <main class="trips">
    <div class="trips-grid" id="trips">
      <!-- AUTO-INDEX-START -->
      <a class="trip-card" href="istanbul-2026/">
        <div class="trip-card-image-placeholder">Istanbul</div>
        <div class="trip-card-body">
          <h2>Istanbul</h2>
          <div class="trip-card-meta">oktober 2026</div>
          <p>Tien dagen aan de Bosporus — twee continenten, duizend jaar geschiedenis.</p>
        </div>
      </a>
      <!-- AUTO-INDEX-END -->
    </div>
  </main>

  <footer>
    &copy; 2026 Peter Wierenga
  </footer>
</body>
</html>
