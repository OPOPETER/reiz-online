name: Update Indexes

on:
  push:
    branches: [main]
    paths:
      - '*/dag-*.html'
      - '*/index.html'
      - 'index.html'

permissions:
  contents: write

jobs:
  update-indexes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate indexes
        run: python3 scripts/generate-indexes.py

      - name: Commit updated indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html */index.html
          git diff --staged --quiet || git commit -m "Auto-update indexes"
          git push
